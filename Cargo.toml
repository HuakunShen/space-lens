[workspace]
# The engine (scan/snapshot/clean/cloud eviction) lives in the vendored Kuntu
# repo; this workspace builds only the product shells around it.
# packages/space-lens-ffi rejoins this list when its in-flight work lands.
members  = ["packages/node", "apps/cli"]
resolver = "2"

  [workspace.package]
  authors    = ["HuakunShen"]
  edition    = "2021"
  license    = "MIT"
  repository = "https://github.com/HuakunShen/space-lens"
  version    = "0.2.8"

[profile.release]
lto   = true
strip = "symbols"
