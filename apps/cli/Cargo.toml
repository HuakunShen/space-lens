[package]
authors.workspace    = true
description          = "Scan disk usage and find cleanup candidates for development projects."
edition.workspace     = true
license.workspace    = true
name                 = "space-lens-cli"
repository.workspace = true
version.workspace    = true

[[bin]]
name = "space-lens"
path = "src/main.rs"

[features]
default = []
mcp = []

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = "1"
serde_json = "1"
# Published to crates.io as kuntu-scan; the path keeps local (submodule) builds.
space-lens = { package = "kuntu-scan", version = "0.2", path = "../../vendors/kuntu/crates/kuntu-scan" }
