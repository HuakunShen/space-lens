[package]
authors.workspace    = true
description          = "Scan disk usage and find cleanup candidates for development projects."
edition.workspace    = true
license.workspace    = true
name                 = "spacelens"
repository.workspace = true
version.workspace    = true

[[bin]]
name = "spacelens"
path = "src/main.rs"

[features]
default = []
mcp = []

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = "1"
serde_json = "1"
# Published to crates.io as kuntu-scan; the path keeps local (submodule) builds.
space-lens = { package = "kuntu-scan", version = "0.2", path = "../../vendors/kuntu/crates/kuntu-scan" }

# cargo-binstall: prebuilt archives from the `cli-v<version>` GitHub release,
# produced by .github/workflows/cli-release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cli-v{ version }/{ name }-{ target }-v{ version }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
