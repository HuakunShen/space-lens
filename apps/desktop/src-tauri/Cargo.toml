[package]
name = "space-lens-desktop"
version = "0.6.0"
description = "Space Lens desktop shell: the web workbench compiled in, the kuntu-scan engine driving it over Tauri IPC."
edition = "2021"
license = "MIT"

# Deliberately its own workspace: a shell that links WebKit/wry must never be
# reachable from the headless crates (packages/node, apps/cli).
[workspace]

[lib]
name = "space_lens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "space-lens-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# BYOK AI proxy (`src/ai.rs`): one non-streaming chat completion from the
# native side so the API key never reaches the WebView. reqwest 0.13 renamed
# the old `rustls-tls` feature: `rustls-no-provider` is the variant this
# lockfile already resolves (tauri-plugin-updater enables it), so the
# dependency tree does not grow; ai.rs installs the ring provider itself.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
trash = "5"
sha1 = "0.10"
# Global allocator (src/lib.rs). The system allocator kept a freed scan's
# memory resident — gigabytes after a rescan — while mimalloc hands freed
# pages back to the OS; `extended` exposes `mi_collect` for doing so at once.
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
# statvfs for pre-scan volume capacity on roots; the engine crate owns the
# scan-time volume walk, but `roots()` lives in this shell.
libc = "0.2"
# The engine, vendored at the repo root; aliased under the familiar name.
space-lens = { package = "kuntu-scan", path = "../../../vendors/kuntu/crates/kuntu-scan" }
# Shared discovery heuristics (cache categories) — the CLI's MCP adapter
# consumes the same crate, so the catalogs cannot drift apart.
spacelens-discovery = { path = "../../../crates/discovery" }
spacelens-app-audit = { path = "../../../crates/app-audit" }
# APFS container accounting attached to finished scans ("hidden space").
spacelens-storage-usage = { path = "../../../crates/storage-usage" }
# The process/memory engine, in-process for the desktop (§3 of
# docs/memory-cleaner-plan.md). The `appkit` feature enables the macOS
# NSRunningApplication quit and the frontmost-app reading.
spacelens-memory = { path = "../../../crates/memory", features = ["appkit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSColor", "NSColorSpace", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSString", "NSProcessInfo", "NSGeometry", "NSNotification", "NSOperation", "NSDistributedNotificationCenter"] }
block2 = "0.6.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
