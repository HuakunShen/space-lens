[package]
authors.workspace    = true
description          = "Read-only audit of per-application storage across scattered locations."
edition.workspace    = true
license.workspace    = true
name                 = "spacelens-app-audit"
repository.workspace = true
version.workspace    = true

[dependencies]
applications = "0.3.1"
chrono       = { version = "0.4", default-features = false, features = ["clock"] }
plist        = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# Published to crates.io as kuntu-scan; the path keeps local (submodule) builds.
space-lens = { package = "kuntu-scan", version = "0.3", path = "../../vendors/kuntu/crates/kuntu-scan" }
