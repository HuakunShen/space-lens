[package]
name                 = "spacelens-remote"
description          = "Headless SSH remote-host support for Space Lens: targets, quoting, OpenSSH config, provisioning contracts."
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
version.workspace    = true

[dependencies]
flate2     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
tar        = "0.4"
thiserror  = "2"
