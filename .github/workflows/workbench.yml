# Gates and releases for the multi-runtime work added on top of the npm/TUI
# line (which CI.yml still owns):
#   - packages/contract · client · host   (closed JSON contract + HTTP/SSE host)
#   - apps/web                            (one SPA, two build flavors)
#   - apps/desktop                        (Tauri shell, own Cargo workspace)
#   - apps/vscode                         (extension: supervisor + webview)
#
# Releases ride the same tag: `app-v1.2.3` builds the desktop bundles and the
# vsix together. The npm line keeps its own `v*` tags in CI.yml.
name: Workbench

on:
  push:
    branches:
      - main
    tags:
      - 'app-v*'
  pull_request:

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS — typecheck, tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - name: Prepare workspace install
        run: node scripts/prepare-ci-install.mjs strip
      - run: yarn install --no-immutable
      - name: Contract artifacts are byte-fresh
        run: yarn workspace @space-lens/contract test
      # host tests import apps/web sources (base-url), whose tsconfig extends
      # the generated .svelte-kit/tsconfig.json — sync it before transforming.
      - name: SvelteKit sync
        run: yarn workspace @space-lens/web prepare
      - name: Unit tests (contract, client, host, web-ui, web)
        run: |
          yarn workspace @space-lens/client test
          yarn workspace @space-lens/host test
          yarn workspace @space-lens/web-ui test
          yarn workspace @space-lens/web test
      - name: Typecheck every JS workspace
        run: yarn typecheck
      - name: Web build (browser flavor)
        run: yarn workspace @space-lens/web build
      - name: Web build (desktop flavor)
        run: yarn workspace @space-lens/web build:desktop
      - name: Wrangler deploy dry-run (no auth needed)
        run: yarn workspace @space-lens/web exec wrangler deploy --dry-run
      - name: VS Code extension compile
        run: yarn workspace space-lens-vscode compile

  desktop-test:
    name: Desktop — cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Stub the Tauri frontendDist (generate_context! checks the path exists; the release job builds it for real)
        working-directory: apps/desktop/src-tauri
        run: mkdir -p ../../web/build-desktop
        shell: bash
      - name: cargo test (own workspace; shells that link WebKit stay out of the root crate graph)
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace

  # The engine tests that also exercise the real trash backend need a desktop
  # session; on CI they assert the typed-failure path (see tests/engine.rs).

  desktop-release:
    name: Desktop — bundle (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [js, desktop-test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            targets: ''
          - os: windows-latest
            args: ''
            targets: ''
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - name: Prepare workspace install
        run: node scripts/prepare-ci-install.mjs strip
      - run: yarn install --no-immutable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build the web desktop flavor first (the shell embeds it at compile time)
        run: yarn workspace @space-lens/web build:desktop

      - name: Require the Apple Developer ID configuration
        # Fail before the expensive build: Tauri only *warns* when notarization
        # credentials are missing, which would publish a bundle Gatekeeper rejects.
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID \
                      APPLE_NOTARY_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required Apple signing secret $name is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to build a macOS release without Developer ID signing and notarization credentials"
            exit 1
          fi

          # notarytool reads the key through APPLE_API_KEY_PATH; Tauri does not
          # write it for us, and its search paths are relative to $HOME.
          PRIVATE_KEYS="$RUNNER_TEMP/private_keys"
          mkdir -p "$PRIVATE_KEYS"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" \
            | base64 -D > "$PRIVATE_KEYS/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$PRIVATE_KEYS/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

          # Prove the certificate and its password work now, not after a long
          # build. This keychain is only a probe; Tauri imports APPLE_CERTIFICATE
          # into its own temporary keychain when it signs.
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/preflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE"
          }
          trap cleanup EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -k "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -F "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::the imported certificate does not contain $APPLE_SIGNING_IDENTITY"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — only needed when tauri.conf enables the updater plugin.
          # Create the minisign keypair once: `npx @tauri-apps/cli signer generate -w ~/.tauri/app.key`
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_NOTARY_KEY_ID }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop/src-tauri
          args: ${{ matrix.args }}
          tagName: app-v__VERSION__
          releaseName: 'Space Lens desktop app-v__VERSION__'
          releaseBody: 'Desktop bundles (dmg / deb / AppImage / NSIS) built from the embedded web workbench.'
          releaseDraft: false
          prerelease: false

      - name: Verify the signed and notarized bundle
        # tauri-action has already attached the archives, so a failure here is
        # loud rather than silent: the job goes red and the release is not
        # considered shippable until the same checks pass.
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.targets }}/release/bundle"
          APP="$BUNDLE_DIR/macos/Space Lens.app"
          DMG=""
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          fi

          [ -d "$APP" ] || { echo "::error::missing app bundle: $APP"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

          DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$DETAILS" | grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" \
            || { echo "::error::unexpected Team ID (expected $APPLE_TEAM_ID)"; printf '%s\n' "$DETAILS"; exit 1; }
          printf '%s\n' "$DETAILS" | grep -F "Authority=Developer ID Application" >/dev/null \
            || { echo "::error::not signed with a Developer ID Application certificate"; printf '%s\n' "$DETAILS"; exit 1; }
          printf '%s\n' "$DETAILS" | grep -F "Runtime Version=" >/dev/null \
            || { echo "::error::the hardened runtime is not enabled"; printf '%s\n' "$DETAILS"; exit 1; }

          spctl --assess --type execute --verbose=4 "$APP"
          if [ -n "$DMG" ]; then
            codesign --verify --strict --verbose=2 "$DMG"
          fi

          VALIDATED=false
          for ATTEMPT in 1 2 3; do
            if xcrun stapler validate "$APP"; then
              VALIDATED=true
              break
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "::warning::stapler validation failed; retrying ($ATTEMPT/3)"
              sleep 5
            fi
          done
          if [ "$VALIDATED" != true ]; then
            echo "::error::the notarization ticket is not stapled to $APP"
            exit 1
          fi

  vsix:
    name: VS Code extension — vsix
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [js]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - name: Prepare workspace install
        run: node scripts/prepare-ci-install.mjs strip
      - run: yarn install --no-immutable
      - name: Stamp the tag version into the manifest
        working-directory: apps/vscode
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}" node -e "const fs=require('node:fs');const j=JSON.parse(fs.readFileSync('package.json'));j.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n')"
      - name: Package vsix
        run: yarn workspace space-lens-vscode package
      - name: Attach vsix to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The vsix job runs right after js and can beat the bundle jobs that
        # create the app-v* release; create it on miss so tauri-action's
        # bundles and this vsix land in the same release.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/vscode/space-lens-*.vsix --clobber

  brew-tap:
    name: Homebrew — render the cask and attach it to the release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [desktop-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download dmg artifacts from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/dmg
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir /tmp/dmg
          ls -la /tmp/dmg
      - name: Render the cask with the real versions and sha256
        env:
          VERSION_REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/render-cask.py
      - name: Attach the rendered cask to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" /tmp/space-lens.rb --clobber
