# Publishes the DeepSeek Harness plugin to npm. Same release shape as the
# desktop line: one tag runs the gates and ships the artifact —
# `plugin-v1.2.3` builds the bundle and publishes `dsh-plugin-spacelens`
# with the tag's version.
#
# Requires the repo secret NPM_TOKEN (an automation-type granular token with
# publish rights for dsh-plugin-spacelens). No 2FA prompt is possible in CI,
# which is exactly why automation tokens exist.
name: DSH Plugin

on:
  push:
    tags:
      - 'plugin-v*'
  pull_request:
    paths:
      - 'apps/dsh/**'
      - 'scripts/build-dsh-plugin.mjs'
      - 'packages/host/**'
      - 'apps/web/**'

concurrency:
  group: dsh-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    name: Build and publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --immutable

      - name: The tag names the version package.json carries
        run: |
          VERSION="${GITHUB_REF_NAME#plugin-v}"
          DECLARED=$(node -p "require('./apps/dsh/package.json').version")
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "tag plugin-v$VERSION but package.json says $DECLARED" >&2
            exit 1
          fi

      - name: Build the bundle (types, SPA, host, client)
        run: yarn build:dsh

      - name: Publish
        working-directory: apps/dsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
