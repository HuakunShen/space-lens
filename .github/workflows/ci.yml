name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Spotlight argument/parser tests
        if: runner.os == 'macOS'
        run: cargo test -p kfs-provider-spotlight --locked
      - name: NAPI build, smoke tests and declarations
        working-directory: crates/kfs-napi
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
      - name: Spotlight refuses unsupported platforms instead of falling back
        if: runner.os != 'macOS'
        run: cargo test -p kfs-provider-spotlight --locked search_candidates_returns_unsupported_off_macos
      - name: NAPI generated bindings are reproducible
        working-directory: crates/kfs-napi
        run: |
          pnpm exec napi build --platform --release
          git diff --exit-code -- index.js index.d.ts
